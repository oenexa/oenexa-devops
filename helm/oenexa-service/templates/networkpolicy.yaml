{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.serviceName }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controllers and other authorized services in cluster
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS egress for external APIs / egress proxies
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432 # Postgres
        - protocol: TCP
          port: 6379 # Redis
        - protocol: TCP
          port: 9092 # Kafka
{{- end }}
