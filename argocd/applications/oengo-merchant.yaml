apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oengo-merchant
  namespace: argocd
spec:
  project: oenexa-platform
  source:
    repoURL: 'https://github.com/OENEXA/oenexa-devops.git'
    targetRevision: HEAD
    path: helm/oenexa-service
    helm:
      valueFiles:
        - ../../environments/prod/values.yaml
      values: |
        serviceName: oengo-merchant
        image:
          repository: ghcr.io/oenexa/oengo-merchant
          tag: v1.0.0
        ingress:
          enabled: true
          host: api.oenexa.com
          path: /v1/commerce/merchant
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: oengo-merchant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
