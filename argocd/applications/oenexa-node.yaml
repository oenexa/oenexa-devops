apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oenexa-node
  namespace: argocd
spec:
  project: oenexa-platform
  source:
    repoURL: 'https://github.com/OENEXA/oenexa-devops.git'
    targetRevision: HEAD
    path: helm/oenexa-service
    helm:
      valueFiles:
        - ../../environments/prod/values.yaml
      values: |
        serviceName: oenexa-node
        image:
          repository: ghcr.io/oenexa/oenexa-node
          tag: v1.0.0
        ingress:
          enabled: true
          host: rpc.oenexa.com
          tlsSecretName: oenexa-rpc-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: oenexa-chain
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
