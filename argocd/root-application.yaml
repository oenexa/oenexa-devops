apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oenexa-root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: oenexa-platform
  source:
    repoURL: 'https://github.com/OENEXA/oenexa-devops.git'
    targetRevision: HEAD
    path: argocd/applications
    recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
