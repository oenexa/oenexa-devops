# ==============================================================================
# OENEXA Unified Ecosystem — Master Multi-Container Development Orchestration
# Database-per-Service Architecture: 100% Isolated Data Tiers
# All inter-service data sharing is strictly over network APIs
#
# Usage:
#   docker compose up -d --build
#   docker compose --profile ai up -d --build
#   docker compose --profile blockchain up -d --build
#   docker compose --profile commerce up -d --build
#   docker compose ps
# ==============================================================================

version: "3.8"

networks:
  oenexa-network:
    name: oenexa-network
    driver: bridge

services:

  # ─── 0. EDGE REVERSE PROXY GATEWAY (Caddy 2.8) ────────────────────────────
  caddy:
    image: caddy:2.8-alpine
    container_name: oenexa-edge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../oenexa-infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - oenexa-network

  # ─── 1. ISOLATED PERSISTENCE: AI CORE DATABASE (PostgreSQL 17 + pgvector) ───
  oenexa-ai-postgres:
    profiles: ["ai", "all"]
    image: pgvector/pgvector:pg17
    container_name: oenexa-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OENEXA_AI_DB_USER:-oenexa_ai_admin}
      POSTGRES_PASSWORD: ${OENEXA_AI_DB_PASSWORD:-oenexa_ai_secret_pass}
      POSTGRES_DB: ${OENEXA_AI_DB_NAME:-oenexa_ai_db}
    ports:
      - "5432:5432"
    volumes:
      - oenexa-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OENEXA_AI_DB_USER:-oenexa_ai_admin} -d ${OENEXA_AI_DB_NAME:-oenexa_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oenexa-network

  oenexa-ai-redis:
    profiles: ["ai", "all"]
    image: redis:7-alpine
    container_name: oenexa-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - oenexa-ai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oenexa-network

  # ─── 2. TIER 1: AI OPERATING SYSTEM (Java 25 + React 18) ───────────────────
  oenexa-ai-core:
    profiles: ["ai", "all"]
    build:
      context: ../../oenexa-ai-core
      dockerfile: Dockerfile
    image: oenexa/oenexa-ai-core:latest
    container_name: oenexa-ai-core
    restart: unless-stopped
    depends_on:
      oenexa-ai-postgres:
        condition: service_healthy
      oenexa-ai-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://oenexa-ai-postgres:5432/${OENEXA_AI_DB_NAME:-oenexa_ai_db}
      SPRING_DATASOURCE_USERNAME: ${OENEXA_AI_DB_USER:-oenexa_ai_admin}
      SPRING_DATASOURCE_PASSWORD: ${OENEXA_AI_DB_PASSWORD:-oenexa_ai_secret_pass}
      SPRING_REDIS_HOST: oenexa-ai-redis
      SPRING_REDIS_PORT: 6379
      OENEXA_REDIS_ENABLED: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - oenexa-network

  oenexa-ai-web:
    profiles: ["ai", "all"]
    build:
      context: ../../oenexa-ai-web
      dockerfile: Dockerfile
    image: oenexa/oenexa-ai-web:latest
    container_name: oenexa-ai-web
    restart: unless-stopped
    depends_on:
      oenexa-ai-core:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost/api/v4
    networks:
      - oenexa-network

  # ─── 3. TIER 2: BLOCKCHAIN PLATFORM (Go Consensus + Explorer) ──────────────
  oenexa-node:
    profiles: ["blockchain", "all"]
    build:
      context: ../../oenexa-node
      dockerfile: Dockerfile
    image: oenexa/oenexa-node:latest
    container_name: oenexa-node
    restart: unless-stopped
    ports:
      - "8545:8545"   # Web3 JSON-RPC
      - "8765:8765"   # P2P Gossip
      - "9090:9090"   # Metrics Prometheus
    volumes:
      - onxc-chain-data:/data
    command: >
      start
      --config /data/config.toml
      --datadir /data
      --metrics
      --miner
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - oenexa-network

  oenexa-explorer:
    profiles: ["blockchain", "all"]
    build:
      context: ../../oenexa-explorer
      dockerfile: Dockerfile
    image: oenexa/oenexa-explorer:latest
    container_name: oenexa-explorer
    restart: unless-stopped
    depends_on:
      oenexa-node:
        condition: service_healthy
    ports:
      - "3001:80"
    environment:
      - VITE_RPC_URL=http://localhost/rpc
    networks:
      - oenexa-network

  # ─── 4. TIER 3: INSTITUTIONAL PORTAL & TRADING PLATFORM ─────────────────────
  oenexa-ui:
    profiles: ["portal", "all"]
    build:
      context: ../../oenexa-ui
      dockerfile: Dockerfile
    image: oenexa/oenexa-ui:latest
    container_name: oenexa-ui
    restart: unless-stopped
    ports:
      - "3005:80"
    networks:
      - oenexa-network

volumes:
  caddy-data:
    name: oenexa-caddy-data
  caddy-config:
    name: oenexa-caddy-config
  oenexa-ai-postgres-data:
    name: oenexa-ai-postgres-data
  oenexa-ai-redis-data:
    name: oenexa-ai-redis-data
  onxc-chain-data:
    name: onxc-chain-data
